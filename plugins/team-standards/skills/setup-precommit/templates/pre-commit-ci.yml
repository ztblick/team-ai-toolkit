# CI backstop: re-run every pre-commit hook on each PR.
# Agents (and humans) can skip local hooks; they can't skip this.
name: pre-commit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Uncomment what the repo needs:
      # - uses: actions/setup-node@v4
      #   with: { node-version: "22", cache: npm }
      # - run: npm ci
      # - uses: dtolnay/rust-toolchain@stable
      #   with: { components: "rustfmt, clippy" }
      - uses: pre-commit/action@v3.0.1
